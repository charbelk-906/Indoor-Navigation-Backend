<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Indoor Navigation · Live demo</title>
    <style>
        :root {
            --ink: #071027; --muted: #596B8D; --blue: #1264F5; --light: #E8F1FF; --green: #09A87B;
            --red: #E5484D; --purple: #7C5CFC; --amber: #D97706; --bg: #F6F8FC; --card: #FFFFFF; --line: #E5EAF2;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; background: var(--bg); color: var(--ink);
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
        .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px; }
        svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; }
        .watch { position: sticky; top: 0; z-index: 5; background: var(--light); color: var(--blue); font-size: 12.5px; font-weight: 600;
            padding: calc(6px + env(safe-area-inset-top)) 18px 6px; display: flex; gap: 8px; align-items: center; justify-content: center; }
        .watch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 1.4s infinite; }

        @keyframes blink { 50% { opacity: .3; } }
        .page { display: none; } .page.show { display: block; }
        .top { display: flex; align-items: center; padding-top: 14px; }
        .top .grow > div:first-child { color: var(--muted); font-size: 14px; }
        .top h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .chipst { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 600; }
        .chipst i { width: 8px; height: 8px; border-radius: 50%; }
        .searchbar { margin-top: 12px; height: 50px; background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(7,16,39,.1);
            display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); cursor: pointer; }
        .quick { display: flex; gap: 10px; margin-top: 12px; }
        .quick > div { flex: 1; background: #fff; border-radius: 16px; padding: 10px 0; display: grid; place-items: center; gap: 4px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .circle { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
        .circle svg { width: 20px; height: 20px; }
        .nearest { margin-top: 12px; border-radius: 20px; padding: 16px; color: #fff; display: flex; align-items: center; gap: 14px; transition: background .3s; cursor: pointer; }
        .nearest .ic { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
        .nearest b { display: block; font-size: 18px; } .nearest span { font-size: 13px; opacity: .9; }
        .roadbox { position: relative; margin-top: 12px; border-radius: 24px; overflow: hidden; background: #F4F7FB; }
        .roadbox canvas { width: 100%; display: block; }
        .roadcap { background: #fff; color: var(--muted); font-size: 12px; text-align: center; padding: 8px 12px; }
        .seg { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 3px; display: flex; }
        .seg button { border: 0; background: transparent; font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 999px; color: var(--ink); cursor: pointer; }
        .seg button.sel { background: var(--blue); color: #fff; font-weight: 700; }
        .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
        .list { display: grid; gap: 8px; }
        .row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 1px 2px rgba(7,16,39,.08); cursor: pointer; }
        .grow { flex: 1; min-width: 0; }
        .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .s { font-size: 12px; color: var(--muted); }
        .pin { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; display: grid; place-items: center; flex: none; }
        .muted { color: var(--muted); font-size: 12px; padding: 10px 0; }
        .banner { border-radius: 20px; padding: 16px; color: #fff; display: flex; align-items: center; gap: 14px; transition: background .3s; margin-top: 12px; }
        .banner .ic { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
        .banner .ic svg { width: 32px; height: 32px; }
        .banner b { display: block; font-size: 24px; line-height: 1.15; } .banner span { font-size: 14px; opacity: .92; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip { border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
        .fchip { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
        .fchip.sel { background: #DCE7FD; border-color: #DCE7FD; color: #0B3E9C; font-weight: 600; }
        .hscroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; } .hscroll::-webkit-scrollbar { display: none; }
        .card { background: #fff; border-radius: 18px; box-shadow: 0 1px 3px rgba(7,16,39,.08); padding: 14px 16px; }
        .steps .st { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
        .steps .st:last-child { border-bottom: 0; } .steps .st.done { opacity: .45; } .steps .st.now { font-weight: 700; color: var(--blue); }
        .head { display: flex; align-items: center; gap: 8px; padding-top: 10px; }
        .head h2 { margin: 0; font-size: 20px; } .iconbtn { border: 0; background: transparent; padding: 8px; border-radius: 50%; color: var(--ink); cursor: pointer; }
        input.text, select.text { width: 100%; font: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; font: inherit; font-weight: 650; border-radius: 14px; padding: 13px 16px; cursor: pointer; text-decoration: none; }
        .primary { background: var(--blue); color: #fff; } .ghost { background: var(--light); color: var(--blue); } .full { width: 100%; }
        .acts { display: flex; gap: 8px; margin-top: 12px; }

        .menuitem { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); } .menuitem:last-child { border-bottom: 0; }
        .na { color: var(--muted); text-decoration: line-through; }
        .set { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); } .set:last-child { border-bottom: 0; }
        .set svg { fill: var(--blue); }
        .sw { position: relative; width: 50px; height: 30px; flex: none; } .sw input { display: none; }
        .sw span { position: absolute; inset: 0; background: #C9D3E3; border-radius: 15px; transition: .2s; cursor: pointer; }
        .sw span::after { content: ""; position: absolute; width: 24px; height: 24px; top: 3px; left: 3px; background: #fff; border-radius: 50%; transition: .2s; }
        .sw input:checked + span { background: var(--blue); } .sw input:checked + span::after { left: 23px; }
        nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; z-index: 6; box-shadow: 0 -1px 0 var(--line); padding-bottom: env(safe-area-inset-bottom); }
        nav.tabs .wrap { display: flex; padding: 0 6px; }
        nav.tabs button { flex: 1; border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); padding: 10px 0 10px; display: grid; place-items: center; gap: 3px; cursor: pointer; }
        nav.tabs button .pill { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
        nav.tabs button.sel { color: var(--ink); font-weight: 600; } nav.tabs button.sel .pill { background: #DCE7FD; color: #0B3E9C; }
        .qr { text-align: center; }
        .qr #qrcode { display: inline-block; background: #fff; padding: 14px; border-radius: 16px; border: 1px solid var(--line); }
        .qr .url { font-weight: 700; margin-top: 10px; word-break: break-all; }
        .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
        input[type=range] { width: 100%; accent-color: var(--blue); }
        .sheet { position: fixed; inset: 0; background: rgba(7,16,39,.35); z-index: 10; display: none; align-items: flex-end; }
        .sheet.show { display: flex; }
        .sheet .panel { background: var(--bg); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom)); }
        .grab { width: 40px; height: 5px; border-radius: 3px; background: #C9D3E3; margin: 4px auto 12px; }
    </style>
</head>

    let routeRoad;
    function dijkstra(start, goal, stepFree) {
        const adj = new Map(); S.graph.edges.forEach(e => { if (stepFree && !e.is_accessible) return; if (!adj.has(e.from_node_id)) adj.set(e.from_node_id, []); adj.get(e.from_node_id).push(e); });

            if (acc + L >= R.s || i === N.length - 2) { const t = L ? Math.min(1, (R.s - acc) / L) : 0; pos = { x: N[i].x + (N[i + 1].x - N[i].x) * t, y: N[i].y + (N[i + 1].y - N[i].y) * t }; seg = i; break; } acc += L; }
        const remaining = Math.max(0, R.total - R.s);
        let target = seg + 1; if (target < N.length - 1 && Math.hypot(N[target].x - pos.x, N[target].y - pos.y) < 1) target++;
        let ux = N[target].x - pos.x, uy = N[target].y - pos.y; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
        const sb = (a, b) => mapToBearing(b.x - a.x, b.y - a.y, H ?? 0, mir);
        let turn = null; for (let i = seg + 1; i < N.length - 1; i++) { const t = rel(sb(N[i], N[i + 1]), sb(N[i - 1], N[i])); if (Math.abs(t) >= 30) { turn = [i, t]; break; } }

        let nd = null; if (turn) { const a = N[turn[0]], b = N[turn[0] + 1], l = Math.hypot(b.x - a.x, b.y - a.y) || 1; nd = [(b.x - a.x) / l, (b.y - a.y) / l]; }
        // instruction (same rules as the app)
        let state = "Straight", title = "Go straight", sub = dt != null ? `${lenText(dt)}, then turn ${turn[1] > 0 ? "right" : "left"}` : `${lenText(remaining)} to ${R.dest.name}`, arrow = null;
        if (S.compass && S.myHeading != null && H != null) arrow = rel(mapToBearing(ux, uy, H, mir), S.myHeading);
        if (remaining < 1) { state = "Arrived"; title = "You've arrived"; sub = R.dest.name; }
        else if (arrow != null && Math.abs(arrow) > 135) { state = "TurnAround"; title = "Turn around"; sub = R.dest.name + " is behind you"; }
        else if (arrow != null && Math.abs(arrow) > 35) { state = "Turn"; title = arrow > 0 ? "Turn right" : "Turn left"; sub = "then walk straight"; }
        else if (arrow == null && dt != null && dt < 1.5) { state = "Turn"; title = turn[1] > 0 ? "Turn right" : "Turn left"; sub = "at " + nodeName(N[turn[0]], R.dest); }
        const st = STATE[state];
        $("#rDest").textContent = R.dest.name;
        $("#rLeft").textContent = state === "Arrived" ? "You've arrived" : `${lenText(remaining)} left · about ${Math.max(1, Math.round(remaining / S.speed))} s`;
        $("#rBanner").style.background = st[0];
        $("#rIcon").innerHTML = ic(st[1], `style="transform:rotate(${state === "Turn" ? (/left/.test(title) ? -90 : 90) : st[2]}deg)"`);
        $("#rTitle").textContent = title; $("#rSub").textContent = sub;
        $("#rFrom").textContent = `From ${R.from} · ${lenText(R.total)}`;
        // beacons along the road
        const heard = new Set(S.online ? (S.live?.beacons || []).map(b => b.id) : []);
        const place = (bx, by) => { const vx = bx - pos.x, vy = by - pos.y; let s = vx * ux + vy * uy, lat = ux * vy - uy * vx;
            if (turn && s > dt) { const tn = N[turn[0]], wx = bx - tn.x, wy = by - tn.y, a2 = wx * nd[0] + wy * nd[1]; if (a2 > 0) { s = dt + 1.8 * Math.PI / 2 + a2; lat = nd[0] * wy - nd[1] * wx; } }
            if (mir) lat = -lat; return [s, lat]; };
        const items = [];
        if (S.roadBeacons) S.beacons.filter(b => b.floor_id === R.dest.floor_id).forEach(b => { const [s, lat] = place(b.x, b.y);
            if (s >= 0.3 && s <= 40 && Math.abs(lat) < 8) items.push({ label: b.label, badge: String(b.minor), s, side: lat >= 0 ? -1 : 1, color: heard.has(b.id) ? C.green : C.grey, live: heard.has(b.id) }); });
        const last = N[N.length - 1]; { const [s] = place(last.x, last.y); if (s >= 0.3 && s <= 40) items.push({ label: R.dest.name, badge: "★", s, side: 0, color: placeColor(R.dest.type), live: true }); }
        routeRoad.set({ arrow: state === "Arrived" ? null : arrow, turnAt: state === "Arrived" ? null : dt, turnDir: turn ? (turn[1] > 0 ? 1 : -1) : 0, items, walking: R.s > 0 && R.s < R.total, accent: st[0] });
        const steps = stepsFor(R.ids, R.dest, H, mir); $("#rSteps").innerHTML = stepsHtml(steps, seg);
    }
    setInterval(() => { if (page === "route" && S.compass) updateRoute(); }, 150);

    // ───────── PROFILE & settings ─────────
    function sw(id, on) { return `<label class="sw"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><span></span></label>`; }
    function renderProfile() {
        $("#p-profile").innerHTML = `<div class="top"><div class="grow"><div>Web demo</div><h1>Profile & settings</h1></div></div>
    <div class="sec">Navigation</div><div class="card">
      <div class="set">${ic("walk")}<div class="grow"><div class="t">Step-free routes</div><div class="s">Avoid stairs and escalators; use elevators and ramps</div></div>${sw("sStep", S.stepFree)}</div>
      <div class="set" style="display:block"><div style="display:flex;gap:14px;align-items:center">${ic("walk")}<div class="grow"><div class="t">Walking speed</div><div class="s">Used for the time estimates</div></div></div>
        <div class="chips">${[["Relaxed", 0.9], ["Normal", 1.2], ["Fast", 1.5]].map(([l, v]) => `<span class="fchip ${S.speed === v ? "sel" : ""}" data-speed="${v}">${l}</span>`).join("")}</div></div>
      <div class="set">${ic("compass")}<div class="grow"><div class="t">Use my compass</div><div class="s" id="cState">${S.compass ? "On · " + Math.round(S.myHeading ?? 0) + "°" : "Your arrow turns when you turn your phone"}</div></div>
        <button class="btn ghost" id="cBtn" style="padding:8px 14px">${S.compass ? "On" : "Allow"}</button></div>
    </div>
    <div class="sec">Display</div><div class="card">
      <div class="set">${ic("ruler")}<div class="grow"><div class="t">Use feet</div><div class="s">${S.feet ? "Distances in feet" : "Distances in metres"}</div></div>${sw("sFeet", S.feet)}</div>
      <div class="set" style="display:block"><div style="display:flex;gap:14px;align-items:center">${ic("nav")}<div class="grow"><div class="t">Your position on the road</div><div class="s">The arrow turns with the compass</div></div></div>
        <div class="chips">${[["both", "Dot + arrow"], ["arrow", "Arrow"], ["dot", "Blue dot"]].map(([k, l]) => `<span class="fchip ${S.marker === k ? "sel" : ""}" data-mark="${k}">${l}</span>`).join("")}</div></div>
      <div class="set">${ic("bt")}<div class="grow"><div class="t">Show beacons along the road</div><div class="s">Beacons appear on the left and right as you walk</div></div>${sw("sBeac", S.roadBeacons)}</div>
    </div>
    <div class="sec">Share this demo</div><div class="card qr"><div id="qrcode"></div><div class="url" id="qrUrl"></div><div class="s">Scan with any phone camera · no app to install</div></div>
    <div class="sec">About</div><div class="card"><div class="set"><div class="grow">Server</div><b class="s">${esc(location.host)}</b></div>
      <div class="set"><div class="grow">Version</div><b class="s">1.0 web demo</b></div></div>`;
        $("#sStep").onchange = e => { S.stepFree = e.target.checked; save("stepFree", S.stepFree); };
        $("#sFeet").onchange = e => { S.feet = e.target.checked; save("feet", S.feet); renderProfile(); };
        $("#sBeac").onchange = e => { S.roadBeacons = e.target.checked; save("roadBeacons", S.roadBeacons); };
        document.querySelectorAll("[data-speed]").forEach(c => c.onclick = () => { S.speed = +c.dataset.speed; save("speed", S.speed); renderProfile(); });
        document.querySelectorAll("[data-mark]").forEach(c => c.onclick = () => { S.marker = c.dataset.mark; save("marker", S.marker); bindMarkers(); renderProfile(); });
        $("#cBtn").onclick = enableCompass;
        makeQr();
    }
    S.stepFree = load("stepFree", false);
    let qrLib = false;
    function makeQr() {
        const url = location.origin + "/demo"; $("#qrUrl").textContent = url.replace(/^https?:\/\//, "");
        const drawQr = () => { $("#qrcode").innerHTML = ""; new QRCode($("#qrcode"), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); };
        if (qrLib) return drawQr();
        const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
        s.onload = () => { qrLib = true; if ($("#qrcode")) drawQr(); }; document.head.appendChild(s);
    }
    async function enableCompass() {
        try {
            if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                const r = await DeviceOrientationEvent.requestPermission(); if (r !== "granted") throw new Error("denied"); }
            const onOri = e => { let h = null;
                if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading; else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;
                if (h == null) return; S.myHeading = norm(h + ((screen.orientation && screen.orientation.angle) || window.orientation || 0)); S.compass = true;
                const cs = $("#cState"); if (cs) cs.textContent = "On · " + Math.round(S.myHeading) + "°"; };
            window.addEventListener("deviceorientationabsolute", onOri, true); window.addEventListener("deviceorientation", onOri, true);
            const b = $("#cBtn"); if (b) b.textContent = "On";
            setTimeout(() => { if (!S.compass && $("#cState")) $("#cState").textContent = "No compass reading on this phone or browser"; }, 3000);
        } catch (e) { const cs = $("#cState"); if (cs) cs.textContent = "Compass permission was refused"; }
    }

    // ───────── live updates from the presenter ─────────
    async function poll() {
        try { const r = await api("/live/state"); S.online = !!r.online; S.live = r.data || null; } catch (e) { S.online = false; }
        if (S.online && S.live) (S.live.beacons || []).forEach(b => { const h = S.hist[b.id] || (S.hist[b.id] = []); h.push(b.d); if (h.length > 6) h.shift(); });
        const w = $("#watch"); w.className = "watch" + (S.online ? "" : " off");
        $("#watchText").textContent = !S.online ? "The presenter's phone isn't sharing right now" : S.live?.nav ? `Live · the presenter is navigating to ${S.live.nav.dest_name}` : "Live · you're seeing the presenter's phone";
        if (page === "home") renderHome();
        setTimeout(poll, 1000);
    }
    (async function start() {
        go(location.hash === "#qr" ? "profile" : "home");
        try { S.beacons = (await api(`/beacons?location_id=${LOCATION_ID}`)).beacons || []; } catch (e) {}
        try { S.graph = await api(`/navigation/graph?location_id=${LOCATION_ID}`); } catch (e) {}
        try { S.places = (await api(`/destinations?location_id=${LOCATION_ID}&q=`)).destinations || []; } catch (e) {}
        if (page === "search") renderSearch();
        poll();
    })();
</script>
